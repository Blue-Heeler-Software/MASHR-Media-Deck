name: Core security

on:
  push:
    paths:
      - "app/**"
      - "companion/**"
      - "browser-extension/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradlew*"
      - ".github/workflows/core-security.yml"
  pull_request:
    paths:
      - "app/**"
      - "companion/**"
      - "browser-extension/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradlew*"
      - ".github/workflows/core-security.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew lintDebug compileReleaseJavaWithJavac processReleaseManifest --no-daemon
      - name: Verify release manifest is not debuggable
        run: |
          manifest=$(find app/build/intermediates/merged_manifest app/build/intermediates/merged_manifests -path '*/release/*/AndroidManifest.xml' -print -quit 2>/dev/null)
          test -n "$manifest"
          if grep -q 'android:debuggable="true"' "$manifest"; then
            echo "Release manifest is debuggable"
            exit 1
          fi
      - name: Verify unsigned release packaging is blocked
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon > release-signing-check.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "Release packaging requires" release-signing-check.log

  windows-companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build companion/MediaDeck.Companion.csproj --configuration Release
      - name: Run companion cryptographic self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./companion/bin/Release/net10.0-windows10.0.19041.0/MediaDeck.Companion.exe -ArgumentList --security-self-test -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Security self-test failed with exit code $($process.ExitCode)." }

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
