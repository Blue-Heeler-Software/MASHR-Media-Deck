<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">MASHR Media Deck social preview</title>
  <desc id="desc">MASHR Media Deck branding with extension-free YouTube scenes and gamer media controls on a dark purple background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090A10"/>
      <stop offset="0.58" stop-color="#171923"/>
      <stop offset="1" stop-color="#251D3A"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1110" cy="90" r="280" fill="#A78BFA" opacity=".08"/>
  <circle cx="1100" cy="600" r="360" fill="#7DD3FC" opacity=".05"/>

  <g transform="translate(72 70)">
