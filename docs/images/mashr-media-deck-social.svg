  <text x="72" y="300" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="8">MEDIA DECK</text>
  <text x="72" y="374" fill="#F6F4FF" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="600">Your PC keeps the game.</text>
  <text x="72" y="414" fill="#B8B7C8" font-family="Segoe UI, Arial, sans-serif" font-size="29">Your phone keeps the controls.</text>

  <rect x="72" y="448" width="592" height="54" rx="27" fill="#166534"/>
  <circle cx="106" cy="475" r="12" fill="#22C55E"/>
  <text x="370" y="482" text-anchor="middle" fill="#F0FDF4" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">YOUTUBE SCENES • NO EXTENSION</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="72" y="520" width="178" height="42" rx="21" fill="#28243C"/>
    <text x="161" y="547" text-anchor="middle" fill="#F6F4FF">STAY IN-GAME</text>
    <rect x="264" y="520" width="194" height="42" rx="21" fill="#28243C"/>
    <text x="361" y="547" text-anchor="middle" fill="#7DD3FC">LIVE ARTWORK</text>
