    <rect x="230" y="392" width="56" height="42" rx="19" fill="#F87171"/>
    <text x="258" y="419" text-anchor="middle" fill="#090A10" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">SUB</text>
    <rect x="292" y="392" width="86" height="42" rx="19" fill="#FBBF24"/>
    <text x="335" y="410" text-anchor="middle" fill="#090A10" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="800">HOLD</text>
    <text x="335" y="424" text-anchor="middle" fill="#090A10" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="800">ALT+TAB</text>
    <text x="52" y="458" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800">YT VOL</text>
    <line x1="108" y1="454" x2="368" y2="454" stroke="#7DD3FC" stroke-width="5" stroke-linecap="round"/>
    <circle cx="306" cy="454" r="8" fill="#7DD3FC"/>
    <rect x="52" y="474" width="326" height="32" rx="16" fill="#166534"/>
